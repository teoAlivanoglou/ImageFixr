<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <style>
    /* Dark Mode (Default) */
    .highlight { fill: #00a8cc; }
    .back { fill: #007595; }
    .border { fill: #ffffff; }
    .mat { fill: #1a202c; }
    .photo { fill: #00a8cc; }

    /* Light Mode */
    @media (prefers-color-scheme: light) {
      .highlight { fill: #0284c7; }
      .back { fill: #0369a1; }
      .border { fill: #0f172a; }
      .mat { fill: #ffffff; }
      .photo { fill: #0284c7; }
    }
  </style>

  <!-- Top Highlight Line (1px illuminated bevel along top edge) -->
  <rect class="highlight" x="1" y="1" width="14" height="1" fill="#00a8cc"/>

  <!-- Back Landscape Canvas (16:10 Ratio, L-cutout with 0 sub-pixel bleed) -->
  <path class="back" d="M 1 2 H 15 V 3 H 6 V 11 H 1 Z" fill="#007595"/>
  
  <!-- Front Portrait Photo (4:5 Ratio, 1px sharp precision border) -->
  <rect class="border" x="6" y="3" width="9" height="12" fill="#ffffff"/>
  <rect class="mat" x="7" y="4" width="7" height="10" fill="#1a202c"/>
  <rect class="photo" x="8" y="5" width="5" height="8" fill="#00a8cc"/>
</svg>