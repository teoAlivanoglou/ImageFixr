<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <!-- Analytical Drop Shadow matching ImageFixr's custom shader aesthetic -->
    <filter id="card-shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Canvas Studio Teal Gradient -->
    <linearGradient id="canvas-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#008cb0"/>
      <stop offset="100%" stop-color="#005d77"/>
    </linearGradient>

    <!-- Luminous Top Bevel -->
    <linearGradient id="bevel-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Photo Subject Core Gradient -->
    <linearGradient id="photo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6eb"/>
      <stop offset="100%" stop-color="#007595"/>
    </linearGradient>
  </defs>

  <!-- Back Canvas (16:10 Ratio, 130 wide × 82 high at 10, 14) -->
  <rect x="10" y="14" width="130" height="82" rx="4" fill="url(#canvas-grad)"/>
  
  <!-- Top Highlight Bevel -->
  <rect x="10" y="14" width="130" height="2.5" rx="1" fill="url(#bevel-grad)"/>
  
  <!-- Safe-Area / Framing Guidelines -->
  <rect x="18" y="22" width="114" height="66" rx="2" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.8" stroke-dasharray="3 2"/>

  <!-- Front Framed Photo Card (4:5 Ratio, 86 wide × 110 high at 62, 36) with real drop shadow -->
  <g filter="url(#card-shadow)">
    <!-- Outer Frame (with ultra-subtle border definition so it looks crisp on both dark and light modes) -->
    <rect x="62" y="36" width="86" height="110" rx="3.5" fill="#ffffff" stroke="rgba(0,0,0,0.12)" stroke-width="0.75"/>
    <!-- Studio Matting -->
    <rect x="67" y="41" width="76" height="100" rx="2" fill="#131722"/>
    <!-- Photo Subject Core -->
    <rect x="73" y="47" width="64" height="88" rx="1.5" fill="url(#photo-grad)"/>
    <!-- Photo Bevel Reflection -->
    <path d="M 73 47 L 137 47 L 73 95 Z" fill="rgba(255,255,255,0.08)"/>
  </g>
</svg>
